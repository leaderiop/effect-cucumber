kind: decisions
package: effect-cucumber
infix: EC
entries:
  - id: "ADR-EC-001"
    file: "001-steps-are-effects.md"
    title: "A step is (...params) => Effect<A, E, R>"
  - id: "ADR-EC-002"
    file: "002-world-is-a-context-service.md"
    title: "World is a typed Context.Service, not context: any"
  - id: "ADR-EC-003"
    file: "003-describefeature-takes-a-layer.md"
    title: "describeFeature takes a Layer; step requirements are typechecked against it"
  - id: "ADR-EC-004"
    file: "004-one-it-effect-per-scenario.md"
    title: "One it.effect per Scenario; Background is inlined, not a hook"
  - id: "ADR-EC-005"
    file: "005-effect-fn-for-step-and-hook-bodies.md"
    title: "Effect.fn wraps step and hook bodies, not manual Effect.gen + withSpan"
  - id: "ADR-EC-006"
    file: "006-two-layer-scopes-only.md"
    title: "Two Layer scopes only: per-Scenario default, per-Feature shared opt-in"
  - id: "ADR-EC-007"
    file: "007-cucumber-expressions-for-step-matching.md"
    title: "Step matching stays cucumber-expressions"
  - id: "ADR-EC-008"
    file: "008-data-tables-and-doc-strings-decode-through-schema.md"
    title: "Data tables and doc strings decode through Schema"
  - id: "ADR-EC-009"
    file: "009-cross-step-state-lives-in-a-ref.md"
    title: "Cross-step scenario state lives in a Ref, never a closure variable"
  - id: "ADR-EC-010"
    file: "010-rule-and-scenario-scoped-extra-layers.md"
    title: "Rule and Scenario can extend the ambient Layer with an extra per-Scenario Layer"
  - id: "ADR-EC-011"
    file: "011-official-cucumber-parser-packages.md"
    title: "Depend on official @cucumber/gherkin and cucumber-expressions"
  - id: "ADR-EC-012"
    file: "012-effect-v4-beta.md"
    title: "Target Effect v4 (beta)"
  - id: "ADR-EC-013"
    file: "013-effect-cucumber-npm-scope.md"
    title: "One package per module under the @effect-cucumber npm scope"
  - id: "ADR-EC-014"
    file: "014-loadfeature-consumes-gherkindocument-and-pickles.md"
    title: "loadFeature consumes both the GherkinDocument and compiled Pickles"
  - id: "ADR-EC-015"
    file: "015-effect-is-a-peer-dependency.md"
    title: "effect is a peer dependency; gherkin package has no effect dependency"
  - id: "ADR-EC-016"
    file: "016-effect-tsgo-language-service-plugin.md"
    title: "Wire @effect/tsgo as the tsc language-service plugin, errors gating the build"
  - id: "ADR-EC-017"
    file: "017-background-and-scenario-are-step-definition-containers.md"
    title: "Background and Scenario are step-definition containers, consistently with Rule/ScenarioOutline"
  - id: "ADR-EC-018"
    file: "018-shared-layer-testclock-isolation.md"
    title: "A shared Layer keeps per-Scenario TestClock isolation via excludeTestServices"
  - id: "ADR-EC-019"
    file: "019-fail-loudly-on-unmatched-or-ambiguous-steps.md"
    title: "Fail loudly on an unmatched, unused, or ambiguous step pattern"
  - id: "ADR-EC-020"
    file: "020-vitest-native-tags-for-skip-only.md"
    title: "@skip/@only and future custom tags map to vitest v4's native tag system"
  - id: "ADR-EC-021"
    file: "021-effect-and-platform-are-peer-dependencies-of-gherkin.md"
    title: "effect and @effect/platform become peer dependencies of gherkin, pinned to v4 only — supersedes ADR-EC-015"
  - id: "ADR-EC-022"
    file: "022-option-replaces-undefined-in-gherkins-public-api.md"
    title: "Option<T> replaces T | undefined throughout gherkin's public API"
  - id: "ADR-EC-023"
    file: "023-parametertypestore-becomes-an-ambient-context-service.md"
    title: "ParameterTypeStore becomes an ambient Context.Service, replacing LoadFeatureOptions"
  - id: "ADR-EC-024"
    file: "024-vitest-owns-a-managedruntime-for-collection-time-loadfeature.md"
    title: "@effect-cucumber/vitest owns one module-scoped ManagedRuntime for collection-time loadFeature"
  - id: "ADR-EC-025"
    file: "025-datatable-wrapper-accessor-contract.md"
    title: "The DataTable wrapper's accessors fail loudly, and both step arguments arrive in source order"
  - id: "ADR-EC-026"
    file: "026-registration-time-tag-filtering-and-declared-tag-universe.md"
    title: "Tags emit natively, includeTags/excludeTags filter at registration time, and the tag universe must be declared in the runner config — supersedes ADR-EC-020"
  - id: "ADR-EC-027"
    file: "027-typed-step-modules.md"
    title: "Cross-Feature step reuse through typed step modules"
  - id: "ADR-EC-028"
    file: "028-testing-failuretag-fails-the-assertion.md"
    title: "Testing.failureTag fails the assertion itself, never returns Option<string> or \"Unknown\""
  - id: "ADR-EC-029"
    file: "029-settlethroughclock-parameterized-fork-adjust-join.md"
    title: "Testing.settleThroughClock parameterizes step/maxSteps and dies rather than hangs past the bound"
  - id: "ADR-EC-030"
    file: "030-gherkinwatchtriggers-plugin-reruns-the-whole-test-include-set.md"
    title: "gherkinWatchTriggers is a Vite plugin over test.watchTriggerPatterns, and reruns the whole test.include set rather than guessing a per-file mapping"
