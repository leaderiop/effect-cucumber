name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the run it replaced; queueing the old one wastes
# minutes and reports a result nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `pnpm lint` is `oxlint -f unix && dprint check` — this single job covers
  # both the lint gate (including the vendored Effect rules) and the format
  # gate of Phase 1 success criterion 3.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `pnpm lint` exiting 0 does NOT prove the vendored effect/* rules loaded:
      # an unresolvable jsPlugins specifier produces the same silent, clean,
      # exit-0 run as a correctly wired one. Without this step the lint gate can
      # decay into a no-op while CI stays green. See scripts/verify-oxlint-plugin.sh.
      - run: pnpm verify:oxlint-plugin

  types:
    name: Types and tsgo gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm build` is `tsc -b`, and every package project is `include: ["src"]`,
      # so it never looks at a test file. vitest transpiles tests without
      # type-checking them. Without this step a file under packages/gherkin/test/
      # can contain type errors that CI never catches — Decision D7.
      - run: pnpm typecheck:test
      # ADR-EC-016: @effect/tsgo's missingLayerContext / missingEffectContext
      # diagnostics are a build gate, not advisory. This step is what enforces
      # that; it must stay a required check, never an allowed failure.
      - run: pnpm verify:tsgo-gate

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is Active LTS and the primary target. 22 is kept for compatibility
        # breadth: a testing library gets installed into whatever runtime the
        # consumer already has, not one we get to choose.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # `pnpm test` exiting 0 does NOT prove any tag reached a real runner task.
      # The gap is narrow: Runner.test.ts watches the TestApi seam against a
      # recording fake, and emission.test.ts watches the undeclared-tag warning —
      # neither can observe what the framework then DID with the tag, and a test
      # cannot observe what its own run registered. Mutation-proven: with
      # describeFeature.ts's adapter dropping one tag on its way into the
      # framework, all 32 files and 741 tests stayed green and only this script
      # went red. It also carries the reporter half of the @skip claim and the
      # absent-vs-skipped distinction between excludeTags and a CLI filter. See
      # scripts/verify-tags-filter.sh.
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before this
      # narrower gate's output. Node 24 ONLY: this is a structural claim about
      # what the runner registers, which does not vary by Node version, and the
      # gate itself invokes vitest twice — running it on both matrix legs would
      # double its cost to re-prove the identical fact.
      - if: matrix.node-version == 24
        run: pnpm verify:tags-filter
      # `pnpm test` exiting 0 does NOT prove that a shared-Layer Scenario reports
      # the SAME status run whole and run narrowed with `-t` to that Scenario
      # alone. No in-process assertion can state it: a test cannot re-invoke the
      # CLI with a narrower selection and compare its own status across the two
      # runs, and ADR-EC-018 names exactly that divergence as the symptom of the
      # defect — "a suite that passes run as a whole can fail under -t filtering
      # (which changes which Scenario runs 'first' against the shared clock), or
      # vice versa". Plans 10-03 and 10-04 do assert build counts and clock
      # readings from inside the process and they do go red for the obvious
      # mutations; this is the whole-versus-filtered EQUIVALENCE half of roadmap
      # SC#3, which `pnpm test` never claims in either direction, and the only
      # place the `-t` half is exercised at all. See
      # scripts/verify-shared-layer-once.sh.
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before this
      # narrower gate's output. Node 24 ONLY: this is a structural claim about
      # what the runner registers, which does not vary by Node version, and the
      # gate invokes vitest THREE times — running it on both matrix legs would
      # triple its cost to re-prove the identical fact.
      - if: matrix.node-version == 24
        run: pnpm verify:shared-layer-once

  package:
    name: Packaging and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify-pack.sh builds each package itself, so no separate `pnpm build`.
      - run: pnpm verify:pack
      - run: pnpm circular
      # `pnpm test` exiting 0 does NOT prove @effect-cucumber/gherkin cannot
      # reach a test runner — a green suite is equally consistent with src/
      # having quietly grown a vitest import. This is PARSE-01's structural
      # proof (a loadFeature that cannot reach a runner cannot register a test)
      # and ADR-EC-015's mechanical guard against effect appearing in a
      # consumer-facing dependency field. See scripts/verify-no-runner-dep.sh.
      - run: pnpm verify:no-runner-dep
      # `pnpm test` and `pnpm build` both exiting 0 do NOT prove that
      # packages/vitest/src/Runner.ts and TestApi.ts are free of a test-framework
      # import — a type-only import there type-checks, lints clean and passes
      # every test while dissolving the injected TestApi seam those two modules'
      # note (a) exists to protect. Mutation-proven: with such an import added,
      # build and test stayed green and only this script went red. See
      # scripts/verify-testapi-seam.sh.
      - run: pnpm verify:testapi-seam
      - run: pnpm verify:spec
