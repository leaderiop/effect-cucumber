name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the run it replaced; queueing the old one wastes
# minutes and reports a result nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `pnpm lint` is `oxlint -f unix && dprint check` — this single job covers
  # both the lint gate (including the vendored Effect rules) and the format
  # gate.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `pnpm lint` exiting 0 does NOT prove the vendored effect/* rules loaded:
      # an unresolvable jsPlugins specifier produces the same silent, clean,
      # exit-0 run as a correctly wired one. Without this step the lint gate can
      # decay into a no-op while CI stays green. See scripts/verify-oxlint-plugin.sh.
      - run: pnpm verify:oxlint-plugin

  types:
    name: Types and tsgo gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm build` is `tsc -b`, and every package project is `include: ["src"]`,
      # so it never looks at a test file. vitest transpiles tests without
      # type-checking them. Without this step a file under packages/gherkin/test/
      # can contain type errors that CI never catches — Decision D7.
      - run: pnpm typecheck:test
      # ADR-EC-016: @effect/tsgo's missingLayerContext / missingEffectContext
      # diagnostics are a build gate, not advisory. This step is what enforces
      # that; it must stay a required check, never an allowed failure.
      - run: pnpm verify:tsgo-gate

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is Active LTS and the primary target. 22 and 20 are kept for
        # compatibility breadth: a testing library gets installed into whatever
        # runtime the consumer already has, not one we get to choose, and 20 is
        # the floor both packages declare in engines.node.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # `pnpm test` exiting 0 says nothing about how MUCH of packages/*/src it exercised —
      # spec/traceability.md §6's 90%/90% statement/branch target per package, checked here rather
      # than blended so one package's tests cannot pad over the other's gaps. Node 24 ONLY: coverage
      # is a property of the source, not of which Node version ran it, and the v8 provider's
      # instrumentation cost is not worth paying three times over to re-prove the same numbers.
      - if: matrix.node-version == 24
        run: pnpm coverage
      # `pnpm test` exiting 0 does NOT prove the suite is free of declaration-order
      # coupling: vitest runs a file's suites in order unless told otherwise, and
      # an observer `describe` that reads what an earlier Feature recorded passes
      # by that accident. Shuffling suites and tests is what catches it, and it
      # doubles as the proof that describeFeature's blocks stay in document
      # order under shuffle (BEH-EC-002). Node 24 only — structural, not per-runtime.
      - if: matrix.node-version == 24
        run: pnpm test:shuffle
      # `pnpm test` exiting 0 does NOT prove any tag reached a real runner task.
      # The gap is narrow: Runner.test.ts watches the TestApi seam against a
      # recording fake, and emission.test.ts watches the undeclared-tag warning —
      # neither can observe what the framework then DID with the tag, and a test
      # cannot observe what its own run registered. Mutation-proven: with
      # describeFeature.ts's adapter dropping one tag on its way into the
      # framework, all 32 files and 741 tests stayed green and only this script
      # went red. It also carries the reporter half of the @skip claim and the
      # absent-vs-skipped distinction between excludeTags and a CLI filter. See
      # scripts/verify-tags-filter.sh.
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before this
      # narrower gate's output. Node 24 ONLY: this is a structural claim about
      # what the runner registers, which does not vary by Node version, and the
      # gate itself invokes vitest twice — running it on both matrix legs would
      # double its cost to re-prove the identical fact.
      - if: matrix.node-version == 24
        run: pnpm verify:tags-filter
      # `pnpm test` exiting 0 does NOT prove that a shared-Layer Scenario reports
      # the SAME status run whole and run narrowed with `-t` to that Scenario
      # alone. No in-process assertion can state it: a test cannot re-invoke the
      # CLI with a narrower selection and compare its own status across the two
      # runs, and ADR-EC-018 names exactly that divergence as the symptom of the
      # defect — "a suite that passes run as a whole can fail under -t filtering
      # (which changes which Scenario runs 'first' against the shared clock), or
      # vice versa". Plans 10-03 and 10-04 do assert build counts and clock
      # readings from inside the process and they do go red for the obvious
      # mutations; this is the whole-versus-filtered EQUIVALENCE half of roadmap
      # SC#3, which `pnpm test` never claims in either direction, and the only
      # place the `-t` half is exercised at all. See
      # scripts/verify-shared-layer-once.sh.
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before this
      # narrower gate's output. Node 24 ONLY: this is a structural claim about
      # what the runner registers, which does not vary by Node version, and the
      # gate invokes vitest THREE times — running it on both matrix legs would
      # triple its cost to re-prove the identical fact.
      - if: matrix.node-version == 24
        run: pnpm verify:shared-layer-once
      # `pnpm test` exiting 0 does NOT prove that editing a `.feature` file
      # under a WATCHING runner reruns anything. It cannot: `pnpm test` is
      # `vitest run`, one shot, one collection — it never watches, so it has no
      # opinion about watching. The place a non-watched fixture is discovered is
      # a consumer's dev loop, where they add a Scenario, see stale results and
      # conclude the library is broken. Measured both ways
      # by the gate itself: the `?raw` import form reruns in ~620ms, and the
      # path-based `loadFeature` form does not rerun at all inside a 60s poll.
      # This is also the ONE gate in the repository that mutates a file, and it
      # mutates a copy under a trap — a failed run leaves the tree clean, which
      # is asserted on both paths. See scripts/verify-watch-rerun.sh.
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before this
      # narrower gate's output. Node 24 ONLY: this is a structural claim about
      # what the runner watches, which does not vary by Node version, and the
      # gate holds a watching runner open across two collections — running it on
      # both matrix legs would double its cost to re-prove the identical fact.
      - if: matrix.node-version == 24
        run: pnpm verify:watch-rerun
      # `pnpm test` exiting 0 does NOT prove that a failing step's own pattern
      # and its `.feature` file:line reach the reporter's own failure panel —
      # only that `ScenarioEffect.test.ts`'s in-process `Exit` inspection
      # observed a `.cause` attached to the failure value. The claim is about
      # what a real `vitest run`'s DEFAULT reporter actually PRINTS: `.cause`
      # is followed and rendered as "Caused by:" only when it carries a
      # `.name`, which is exactly the primary-source finding
      # `research/vitest-failure-reporter-surface.md` made and this gate
      # re-proves against real stdout, not the types alone. See
      # scripts/verify-failure-panel.sh.
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before this
      # narrower gate's output. Node 24 ONLY: this is a structural claim about
      # what the reporter prints, which does not vary by Node version, and the
      # gate invokes vitest once against a dedicated standalone config —
      # running it on both matrix legs would double its cost to re-prove the
      # identical fact.
      - if: matrix.node-version == 24
        run: pnpm verify:failure-panel
      # `pnpm test` exiting 0 does NOT prove that data attached from inside a
      # step via `attach(contentType, data)` reaches the reporter's own
      # failure panel — only that an in-process test observed
      # `Attachments`' live implementation call `ctx.annotate`. The claim is
      # about what a real `vitest run`'s DEFAULT reporter actually PRINTS,
      # the identical "real stdout, not the types alone" shape
      # `verify-failure-panel.sh` above proves for a failing step's own
      # pattern/location. See scripts/verify-attachments-panel.sh
      # (ADR-EC-036, BEH-EC-028).
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before
      # this narrower gate's output. Node 24 ONLY, for the identical reason
      # `verify:failure-panel` above is: a structural claim about what the
      # reporter prints, which does not vary by Node version, and the gate
      # invokes vitest once against its own dedicated standalone config.
      - if: matrix.node-version == 24
        run: pnpm verify:attachments-panel
      # `pnpm test` exiting 0 does NOT prove that the 24-item checklist in
      # spec/process/looks-done-but-isnt-checklist.md still runs in full, and it
      # proves nothing at all about ten of its items: a packed tarball's
      # manifest does not exist during a test run, a README's install line is
      # not compiled, a compile gate's behaviour when a directive becomes UNUSED
      # is the ABSENCE of a diagnostic, a shuffled run and a tag-filtered run
      # are properties of an invocation, and reading a failure panel requires a
      # run that failed. It also carries the completeness cross-check that makes
      # roadmap success criterion 4 a counted claim: mutation-proven, a test that
      # loses its `P-NN` id leaves `pnpm test` green at identical counts and
      # only this script goes red. See scripts/verify-pitfalls-checklist.sh.
      #
      # AFTER `pnpm test`, so an ordinary suite failure is reported before this
      # narrower gate's output. Node 24 ONLY: every claim it makes is structural
      # and does not vary by Node version, and the gate invokes vitest FOUR times
      # and packs both packages — running it on both matrix legs would double a
      # substantial cost to re-prove the identical fact.
      - if: matrix.node-version == 24
        run: pnpm verify:pitfalls

  package:
    name: Packaging and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify-pack.sh builds each package itself, so no separate `pnpm build`.
      - run: pnpm verify:pack
      - run: pnpm circular
      # `pnpm test` exiting 0 does NOT prove @effect-cucumber/gherkin cannot
      # reach a test runner — a green suite is equally consistent with src/
      # having quietly grown a vitest import. A loadFeature that cannot reach a
      # runner cannot register a test; the script is also ADR-EC-015's mechanical
      # guard against effect appearing in a consumer-facing dependency field.
      # See scripts/verify-no-runner-dep.sh.
      - run: pnpm verify:no-runner-dep
      # `pnpm test` and `pnpm build` both exiting 0 do NOT prove that
      # packages/vitest/src/Runner.ts and TestApi.ts are free of a test-framework
      # import — a type-only import there type-checks, lints clean and passes
      # every test while dissolving the injected TestApi seam those two modules'
      # note (a) exists to protect. Mutation-proven: with such an import added,
      # build and test stayed green and only this script went red. See
      # scripts/verify-testapi-seam.sh.
      - run: pnpm verify:testapi-seam
      # `pnpm test` exiting 0 does NOT prove that no acceptance step module
      # closes over a mutable binding. A Scenario whose steps thread a value
      # through a closure variable PASSES on a clean run — one Scenario is one
      # Effect and its steps run in order — and leaks only across retries,
      # re-runs and `-t`-narrowed selections, so observation cannot tell "has no
      # mutable cross-step state" from "has it and did not trip on it today".
      # `pnpm lint`, `pnpm build` and `pnpm typecheck:test` are all equally
      # silent, measured as mutation A. This is INV-EC-006's only automated
      # enforcement. See scripts/verify-acceptance-ref-state.sh.
      - run: pnpm verify:acceptance-ref-state
      # `pnpm build` and `pnpm typecheck:test` exiting 0 do NOT prove the
      # acceptance suite is free of the TypeScript escape-hatch type — the whole
      # failure mode is the ABSENCE of a diagnostic. One occurrence is
      # assignable to everything, so a step body carrying one compiles against
      # every ambient Layer including one providing none of the services it
      # reaches for, and INV-EC-003 is erased for that step inside the suite
      # whose job is to prove INV-EC-003. Mutation-proven: with one substituted
      # into a step body's parameter annotation, build and typecheck stayed
      # green and only this script went red. See
      # scripts/verify-acceptance-no-any.sh.
      - run: pnpm verify:acceptance-no-any
      - run: pnpm verify:spec
      # `pnpm verify:spec` checks the spec against ITSELF. An export added to
      # packages/vitest/src/index.ts and never written into spec/overview.md's
      # API table leaves it, build and test all green. See
      # scripts/verify-api-surface.sh.
      - run: pnpm verify:api-surface
      # `verify:api-surface` checks the spec's TABLES against the code; this checks the
      # spec's WORKED-EXAMPLE CODE FENCES against the code. Neither `pnpm build` nor
      # `pnpm typecheck:test` compiles a single line inside a spec/*.md fence, so a
      # signature change can leave every gate above green while a reader who copies the
      # example gets a type error. See scripts/verify-doc-examples.sh.
      - run: pnpm verify:doc-examples
      # Source and test comments must not cite the planning artefacts that live on
      # the planning-archive branch (or ids that resolve only there): a citation a
      # reader cannot open rots silently. See scripts/verify-no-planning-refs.sh.
      - run: pnpm verify:no-planning-refs
