name: Canary against latest effect

# Drift detection, not a release gate: never blocks a PR or the release workflow. Runs on a
# schedule (and on demand) against whatever `effect`, `@effect/vitest` and `@effect/platform-node`
# publish under their own `latest` npm dist-tag TODAY, rather than the versions the committed
# pnpm-lock.yaml resolved (ADR-EC-012: the dev catalog follows the `latest` dist-tag and the lockfile
# is what pins it). A red run here means the next lockfile refresh will need real work, found
# before it lands as a surprise in that refresh's own PR. See spec/roadmap.md's "Under
# consideration" -> canary entry.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC — weekly is plenty for a release line that ships every few weeks.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    name: Build and test against today's effect latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      # Not --frozen-lockfile, and followed by an explicit update: the catalog's `latest` tag is
      # already resolved by the committed lockfile, so only `pnpm update` moves the workspace to
      # today's tag, and only inside this ephemeral checkout.
      - run: pnpm install --no-frozen-lockfile
      - name: Move the lockfile to today's effect latest
        run: pnpm update --recursive effect @effect/platform-node @effect/vitest
      - run: pnpm build
      - run: pnpm typecheck:test
      - run: pnpm test
      - run: pnpm test:shuffle
      # Separate concern from the rc bump above: this checks whether the two files this repo
      # VENDORED instead of depending on (ADR-EC-059) have moved upstream — a drift no
      # `pnpm update` or dependency-bump PR would ever surface, since neither vendored package is
      # a real dependency anywhere. Same "drift detection, not a release gate" posture as this
      # whole workflow: a red run here means a re-sync needs real work, found before it's a
      # surprise. See scripts/verify-vendor-drift.mjs.
      - run: pnpm verify:vendor-drift
